name: tests
on: [push, pull_request]
jobs:
  test:
    strategy:
      matrix:
        python: ['3.11', '3.14']
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install '.[test]'
      - run: pytest
  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t wyoming-halogen:test .
      - run: docker run --rm wyoming-halogen:test --help
      - run: docker run --rm --entrypoint sh wyoming-halogen:test -c 'test "$(id -u)" = 10001'
